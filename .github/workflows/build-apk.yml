name: Build Tag APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log || {
            echo "::group::Build errors"
            grep -E "^(e:|FAILURE:|> Task .* FAILED|error:)" ../build.log | tail -40 || tail -60 ../build.log
            echo "::endgroup::"
            grep -E "^(e:|FAILURE:|error:)" ../build.log | tail -20 | while IFS= read -r line; do
              echo "::error title=Gradle::$line"
            done
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tag-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

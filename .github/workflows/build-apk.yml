name: Build Tag APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Explicit Android SDK (platforms + build-tools). The old step only
      # set ANDROID_HOME / licenses and often failed assembleDebug on CI.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log || {
            echo "::group::Build errors"
            grep -E "^(e:|FAILURE:|> Task .* FAILED|What went wrong|error:)" ../build.log | tail -60 || tail -80 ../build.log
            echo "::endgroup::"
            grep -E "^(e:|FAILURE:|What went wrong|error:)" ../build.log | tail -20 | while IFS= read -r line; do
              echo "::error title=Gradle::$line"
            done
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tag-mobile-video-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.3.0-build${{ github.run_number }}
          name: "Tag Mobile Video v0.3.0 (Build #${{ github.run_number }})"
          body: |
            ## Automated Build from GitHub Actions
            - Camera video recording with synchronized BLE sensor data
            - Audio disabled (Camera2 + MediaRecorder surface)
            - User Profile & Camera configuration persistence
            - File naming: `[Profile]_[DeviceID]_[Timestamp]`
            - Session verification & packet gap detection
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false

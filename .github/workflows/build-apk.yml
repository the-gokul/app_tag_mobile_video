name: Build Tag APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Download and Install Gradle 8.7
        run: |
          curl -sSLO https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Create Gradle wrapper
        working-directory: android
        run: |
          /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tag-mobile-video-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.3.0-build${{ github.run_number }}
          name: "Tag Mobile Video v0.3.0 (Build #${{ github.run_number }})"
          body: |
            ## Automated Build from GitHub Actions
            - Camera video recording with synchronized BLE sensor data
            - Audio disabled (Camera2 + MediaRecorder surface)
            - User Profile & Camera configuration persistence
            - File naming: `[Profile]_[DeviceID]_[Timestamp]`
            - Session verification & packet gap detection
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
